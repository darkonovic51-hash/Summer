<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<body>

<div class="topbar">
  <div class="topbar-user">
    <div class="avatar" id="avatarInitial"></div>
    <div>
      <p class="user-name" id="userNameDisplay"></p>
      <p class="user-level" id="userLevelDisplay"></p>
    </div>
  </div>
  <div class="topbar-stats">
    <div class="stat-chip">🔥 <span id="streakCount">0</span></div>
    <div class="stat-chip">⭐ <span id="xpCount">0</span></div>
  </div>
</div>

<div class="hero">
  <h1 id="greeting" class="fade-in"></h1>
  <p class="hero-sub">استمر في رحلتك نحو إتقان الإنجليزية</p>
</div>

<div class="daily-challenge-card" id="dailyChallengeBtn">
  <div class="dc-icon">🎯</div>
  <div class="dc-text">
    <h3>التحدي اليومي</h3>
    <p>5 أسئلة سريعة • XP مضاعف</p>
  </div>
  <div class="dc-arrow">←</div>
</div>

<h2 class="section-title">مسارك التعليمي</h2>

<div class="levels-path" id="levelsPath"></div>

<nav class="bottom-nav">

</nav>
