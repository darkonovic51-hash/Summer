<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Path | ابدأ رحلتك</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="welcomeScreen" class="screen center-screen">
  <div class="welcome-card fade-in">
    <h1 class="brand-title">English Path</h1>
    <p class="brand-sub">رحلتك نحو إتقان الإنجليزية تبدأ من هنا</p>

    <input type="text" id="nameInput" placeholder="اكتب اسمك هنا..." maxlength="20">
    <button id="startBtn" class="btn-primary">ابدأ الرحلة</button>
    <p id="errorMsg" class="error-text"></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    if (isLoggedIn()) {
      window.location.href = "home.html";
    } else {
      document.getElementById('welcomeScreen').style.display = 'flex';
    }
  });

  document.getElementById('startBtn').addEventListener('click', handleStart);
  document.getElementById('nameInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleStart();
  });

  function handleStart() {
    const nameInput = document.getElementById('nameInput');
    const name = nameInput.value.trim();
    const errorMsg = document.getElementById('errorMsg');

    if (name.length < 2) {
      errorMsg.textContent = "الرجاء إدخال اسم صحيح (حرفين على الأقل)";
      return;
    }

    registerUser(name);
    window.location.href = "home.html";
  }
</script>
</body>
</html>
