<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Path | مراجعة الأخطاء</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="quiz.css">
</head>
<body>

<div class="quiz-header">
  <a href="mistakes.html" class="exit-btn">✕</a>
  <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="reviewProgressFill"></div></div>
  <div class="dc-badge" style="background:rgba(248,113,113,0.15); color:#f87171;">📝 مراجعة</div>
</div>

<div class="quiz-body" id="reviewBody">
  <p class="quiz-question-label">اختر المعنى الصحيح للجملة:</p>
  <div id="reviewPassageBox" class="passage-box" style="display:none;"></div>
  <h2 class="quiz-question" id="reviewQuestionText"></h2>
  <div class="options-grid" id="reviewOptionsGrid"></div>
</div>

<div class="quiz-footer">
  <button id="reviewCheckBtn" class="btn-primary" disabled>تحقق</button>
</div>

<div id="reviewDoneScreen" class="milestone-overlay" style="display:none;">
  <div class="milestone-card fade-in">
    <div style="font-size:50px; margin-bottom:16px;">🎉</div>
    <h2>أحسنت! راجعت كل أخطائك</h2>
    <p id="reviewDoneSub"></p>
    <a href="mistakes.html" class="btn-primary" style="display:block; text-decoration:none; text-align:center; margin-top:10px;">العودة</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="review.js"></script>
</body>
</html>
